<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>!</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --accent: #f59e0b;
        --text: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f2937 0%, var(--bg) 60%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .mark {
        width: 180px;
        height: 180px;
        border-radius: 24px;
        background: rgba(31, 41, 55, 0.8);
        border: 2px solid rgba(245, 158, 11, 0.5);
        box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
        display: grid;
        place-items: center;
        animation: pulse 2s ease-in-out infinite;
      }

      .mark span {
        font-size: 110px;
        line-height: 1;
        font-weight: 900;
        color: var(--accent);
        text-shadow: 0 0 18px rgba(245, 158, 11, 0.8);
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 35px rgba(245, 158, 11, 0.45);
        }
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-label="Exclamation mark">
      <span>!</span>
